apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-management
  labels:
    app: student

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: student

  template:
    metadata:
      name: student-template
      labels:
        app: student

    spec:
      containers:
        - name: student-container
          image: 673498377906.dkr.ecr.eu-north-1.amazonaws.com/student:latest

          ports:
            - name: student-port
              containerPort: 8080

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              memory: "300Mi"
              cpu: "256m"